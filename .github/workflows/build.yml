name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  ATTIC_CACHE: ${{ github.ref == 'refs/heads/master' && 'public' || 'ci' }}
  # Empty on fork PRs (secrets not available) — Attic steps skip via the if below.
  ATTIC_ENDPOINT: ${{ secrets.ATTIC_ENDPOINT }}

jobs:
  release_contract:
    name: Validate release contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate tracked release files
        run: scripts/test-release-contract.sh

      - name: Validate release dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          version="$(tr -d '\n' < VERSION)"
          releases="$(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100"
          )"
          if jq -e --arg tag "$version" \
              'any(.[][]; .tag_name == $tag)' \
              <<<"$releases" >/dev/null; then
            echo "Release $version already exists" >&2
            exit 1
          fi
          refs="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$version"
          )"
          if jq -e --arg ref "refs/tags/$version" \
              'any(.[]; .ref == $ref)' <<<"$refs" >/dev/null; then
            echo "Tag $version already exists" >&2
            exit 1
          fi

      - name: Export version
        id: version
        run: echo "version=$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"

  build-appimage:
    needs: release_contract
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    env:
      ATTIC_AVAILABLE: >-
        ${{
          secrets.ATTIC_ENDPOINT != '' &&
          (
            (github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC != '') ||
            (github.ref != 'refs/heads/master' && secrets.ATTIC_TOKEN_CI != '')
          )
        }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:Z1wyVBEx8PHbXujYB52Mysv9Rd8rWIhyQ3bQyef9yy4=
            fallback = true

      - name: Setup Attic cache
        if: env.ATTIC_AVAILABLE == 'true'
        uses: ryanccn/attic-action@v0.4.1
        with:
          endpoint: ${{ env.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          inputs-from: "."
          token: ${{ github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC || secrets.ATTIC_TOKEN_CI }}

      - name: Build bin-appimage
        run: nix build .#bin-appimage

      - name: Smoke test
        run: |
          nix build .#smoke-test --out-link result-smoke -L
          cat result-smoke/smoke-test.log

      - name: Rename AppImage with architecture
        run: |
          version="$(tr -d '\n' < VERSION)"
          arch="${{ matrix.arch }}"
          arch_short="${arch%%-*}"
          src=$(find result/ -name '*.AppImage' -print -quit)
          cp "$src" "logos-basecamp-${version}-${arch_short}.AppImage"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage-${{ matrix.arch }}
          path: logos-basecamp-*.AppImage

  build-macos-app:
    needs: release_contract
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    env:
      ATTIC_AVAILABLE: >-
        ${{
          secrets.ATTIC_ENDPOINT != '' &&
          (
            (github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC != '') ||
            (github.ref != 'refs/heads/master' && secrets.ATTIC_TOKEN_CI != '')
          )
        }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:Z1wyVBEx8PHbXujYB52Mysv9Rd8rWIhyQ3bQyef9yy4=
            fallback = true

      - name: Setup Attic cache
        if: env.ATTIC_AVAILABLE == 'true'
        uses: ryanccn/attic-action@v0.4.1
        with:
          endpoint: ${{ env.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          inputs-from: "."
          token: ${{ github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC || secrets.ATTIC_TOKEN_CI }}

      - name: Build bin-macos-app
        run: nix build .#bin-macos-app

      - name: Smoke test
        run: |
          nix build .#smoke-test-bundle --out-link result-smoke -L
          cat result-smoke/smoke-test.log

      - name: Package app bundle as tarball
        run: |
          version="$(tr -d '\n' < VERSION)"
          app=$(find result/ -name '*.app' -maxdepth 1 -print -quit)
          tar -czf "logos-basecamp-${version}-aarch64-unsigned.app.tar.gz" -C result "$(basename "$app")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-app-aarch64-darwin
          path: logos-basecamp-*-aarch64-unsigned.app.tar.gz

  test-linux:
    needs: release_contract
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    env:
      ATTIC_AVAILABLE: >-
        ${{
          secrets.ATTIC_ENDPOINT != '' &&
          (
            (github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC != '') ||
            (github.ref != 'refs/heads/master' && secrets.ATTIC_TOKEN_CI != '')
          )
        }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:Z1wyVBEx8PHbXujYB52Mysv9Rd8rWIhyQ3bQyef9yy4=
            fallback = true

      - name: Setup Attic cache
        if: env.ATTIC_AVAILABLE == 'true'
        uses: ryanccn/attic-action@v0.4.1
        with:
          endpoint: ${{ env.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          inputs-from: "."
          token: ${{ github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC || secrets.ATTIC_TOKEN_CI }}

      - name: Unit tests
        run: nix build .#unit-tests -L

      - name: QML tests
        run: nix build .#qml-tests -L

      - name: Sandbox test
        run: nix build .#sandbox-test -L

      - name: Integration test (UI tests)
        run: nix build .#integration-test -L

      - name: Shutdown lifecycle test
        if: matrix.arch == 'x86_64-linux'
        run: nix build .#shutdown-test -L

      # Report-only non-blocking for now
      - name: Coverage report
        continue-on-error: true
        run: |
          nix build .#coverage -L
          {
            echo '## Unit-test coverage'
            echo '```'
            cat result/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.arch }}
          path: result/
          if-no-files-found: ignore

  test-macos:
    needs: release_contract
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    env:
      ATTIC_AVAILABLE: >-
        ${{
          secrets.ATTIC_ENDPOINT != '' &&
          (
            (github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC != '') ||
            (github.ref != 'refs/heads/master' && secrets.ATTIC_TOKEN_CI != '')
          )
        }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:Z1wyVBEx8PHbXujYB52Mysv9Rd8rWIhyQ3bQyef9yy4=
            fallback = true

      - name: Setup Attic cache
        if: env.ATTIC_AVAILABLE == 'true'
        uses: ryanccn/attic-action@v0.4.1
        with:
          endpoint: ${{ env.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          inputs-from: "."
          token: ${{ github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC || secrets.ATTIC_TOKEN_CI }}

      - name: Unit tests
        run: nix build .#unit-tests -L

      - name: QML tests
        run: nix build .#qml-tests -L

      - name: Sandbox test
        run: nix build .#sandbox-test -L

      - name: Integration test (UI tests)
        run: nix build .#integration-test-bundle -L

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [release_contract, build-appimage, build-macos-app, test-linux, test-macos]
    runs-on: ubuntu-latest
    concurrency:
      group: basecamp-release-${{ needs.release_contract.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Confirm version is still unpublished
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release_contract.outputs.version }}
        run: |
          set -euo pipefail
          releases="$(
            gh api --paginate --slurp \
              "repos/$GH_REPO/releases?per_page=100"
          )"
          if jq -e --arg tag "$VERSION" \
              'any(.[][]; .tag_name == $tag)' \
              <<<"$releases" >/dev/null; then
            echo "Release $VERSION already exists" >&2
            exit 1
          fi
          refs="$(
            gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION"
          )"
          if jq -e --arg ref "refs/tags/$VERSION" \
              'any(.[]; .ref == $ref)' <<<"$refs" >/dev/null; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: appimage-x86_64-linux
          path: artifacts/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: appimage-aarch64-linux
          path: artifacts/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-app-aarch64-darwin
          path: artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ./*.AppImage ./*.app.tar.gz > SHA256SUMS

      - name: Create exact release tag
        id: create_tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release_contract.outputs.version }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$VERSION" \
            -f sha="$GITHUB_SHA" >/dev/null
          echo "owned=true" >> "$GITHUB_OUTPUT"

      - name: Create exact owned draft
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release_contract.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$(
            gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="$VERSION" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Logos Basecamp $VERSION" \
              -F draft=true \
              -F prerelease=true \
              -f make_latest=false \
              -F generate_release_notes=true
          )"
          release_id="$(
            jq -er '.id' <<<"$release_json"
          )"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          echo "owned=true" >> "$GITHUB_OUTPUT"

      - name: Upload exact draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
          VERSION: ${{ needs.release_contract.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" |
            jq -e --arg tag "$VERSION" --argjson id "$RELEASE_ID" '
              .id == $id and
              .tag_name == $tag and
              .draft == true and
              .prerelease == true and
              (.assets | length) == 0
            ' >/dev/null
          mapfile -t assets < <(
            find artifacts -maxdepth 1 -type f -printf '%f\n' | sort
          )
          test "${#assets[@]}" -eq 4
          test "$(printf '%s\n' "${assets[@]}" | grep -Ec '\.AppImage$')" -eq 2
          test "$(printf '%s\n' "${assets[@]}" | grep -Ec '\.app\.tar\.gz$')" -eq 1
          test "$(printf '%s\n' "${assets[@]}" | grep -Fxc 'SHA256SUMS')" -eq 1
          for name in "${assets[@]}"; do
            asset_json="$(
              curl --fail-with-body --silent --show-error --location \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/octet-stream" \
                --data-binary @"artifacts/$name" \
                "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=$name"
            )"
            jq -e --arg name "$name" '
              .name == $name and
              .state == "uploaded"
            ' <<<"$asset_json" >/dev/null
          done

      - name: Verify and publish draft
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
          VERSION: ${{ needs.release_contract.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          release_json="$(
            gh api "repos/$GH_REPO/releases/$RELEASE_ID"
          )"
          jq -e --arg tag "$VERSION" '
            .tag_name == $tag and
            .draft == true and
            .prerelease == true and
            (.assets | length) == 4
          ' <<<"$release_json" >/dev/null
          mkdir published-artifacts
          jq -r '.assets[] | [.id, .name] | @tsv' \
              <<<"$release_json" |
            while IFS=$'\t' read -r asset_id asset_name; do
              gh api -H "Accept: application/octet-stream" \
                "repos/$GH_REPO/releases/assets/$asset_id" \
                > "published-artifacts/$asset_name"
            done
          test "$(find published-artifacts -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(wc -l < published-artifacts/SHA256SUMS)" -eq 3
          (
            cd published-artifacts
            sha256sum --check SHA256SUMS
          )
          tag_target="$(
            gh api "repos/$GH_REPO/git/ref/tags/$VERSION" \
              --jq '.object.sha'
          )"
          test "$tag_target" = "$GITHUB_SHA"
          gh api --method PATCH \
            "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false >/dev/null
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" |
            jq -e --arg tag "$VERSION" '
              .tag_name == $tag and
              .draft == false and
              .prerelease == true and
              (.assets | length) == 4
            ' >/dev/null
          published_tag_target="$(
            gh api "repos/$GH_REPO/git/ref/tags/$VERSION" \
              --jq '.object.sha'
          )"
          test "$published_tag_target" = "$GITHUB_SHA"

      - name: Roll back failed release
        if: >-
          always() &&
          steps.create_tag.outputs.owned == 'true' &&
          steps.publish_release.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
          RELEASE_OWNED: ${{ steps.create_release.outputs.owned }}
          VERSION: ${{ needs.release_contract.outputs.version }}
        run: |
          set -euo pipefail
          cleanup_failed=0
          can_delete_tag=true
          if [[ "$RELEASE_OWNED" == "true" ]]; then
            if [[ -z "$RELEASE_ID" ]]; then
              echo "Owned release ID is missing" >&2
              cleanup_failed=1
              can_delete_tag=false
            elif ! gh api --method DELETE \
                "repos/$GH_REPO/releases/$RELEASE_ID"; then
              cleanup_failed=1
              can_delete_tag=false
            fi
          fi
          if [[ "$can_delete_tag" == "true" ]] &&
              ! git push --porcelain \
                --force-with-lease="refs/tags/$VERSION:$GITHUB_SHA" \
                origin ":refs/tags/$VERSION"; then
            refs="[]"
            if ! refs="$(
              gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION"
            )"; then
              cleanup_failed=1
            else
              tag_target="$(
                jq -r --arg ref "refs/tags/$VERSION" '
                  first(.[] | select(.ref == $ref) | .object.sha) // empty
                ' <<<"$refs"
              )"
              if [[ "$tag_target" == "$GITHUB_SHA" ]]; then
                echo "Failed to delete the owned release tag" >&2
                cleanup_failed=1
              elif [[ -n "$tag_target" ]]; then
                echo "Preserving tag moved to $tag_target" >&2
              fi
            fi
          fi
          exit "$cleanup_failed"
