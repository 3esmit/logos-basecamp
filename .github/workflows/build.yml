name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  ATTIC_CACHE: ${{ github.ref == 'refs/heads/master' && 'public' || 'ci' }}

jobs:
  release_contract:
    name: Validate release contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate tracked release files
        run: scripts/test-release-contract.sh

      - name: Validate release dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          version="$(tr -d '\n' < VERSION)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists" >&2
            exit 1
          fi

      - name: Export version
        id: version
        run: echo "version=$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"

  build-appimage:
    needs: release_contract
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    env:
      ATTIC_AVAILABLE: >-
        ${{
          secrets.ATTIC_ENDPOINT != '' &&
          (
            (github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC != '') ||
            (github.ref != 'refs/heads/master' && secrets.ATTIC_TOKEN_CI != '')
          )
        }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:Z1wyVBEx8PHbXujYB52Mysv9Rd8rWIhyQ3bQyef9yy4=
            fallback = true

      - name: Setup Attic cache
        if: env.ATTIC_AVAILABLE == 'true'
        uses: ryanccn/attic-action@v0.4.1
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          inputs-from: "."
          token: ${{ github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC || secrets.ATTIC_TOKEN_CI }}

      - name: Build bin-appimage
        run: nix build .#bin-appimage

      - name: Smoke test
        run: |
          nix build .#smoke-test --out-link result-smoke -L
          cat result-smoke/smoke-test.log

      - name: Rename AppImage with architecture
        run: |
          version="$(tr -d '\n' < VERSION)"
          arch="${{ matrix.arch }}"
          arch_short="${arch%%-*}"
          src=$(find result/ -name '*.AppImage' -print -quit)
          cp "$src" "logos-basecamp-${version}-${arch_short}.AppImage"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage-${{ matrix.arch }}
          path: logos-basecamp-*.AppImage

  build-macos-app:
    needs: release_contract
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    env:
      ATTIC_AVAILABLE: >-
        ${{
          secrets.ATTIC_ENDPOINT != '' &&
          (
            (github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC != '') ||
            (github.ref != 'refs/heads/master' && secrets.ATTIC_TOKEN_CI != '')
          )
        }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:Z1wyVBEx8PHbXujYB52Mysv9Rd8rWIhyQ3bQyef9yy4=
            fallback = true

      - name: Setup Attic cache
        if: env.ATTIC_AVAILABLE == 'true'
        uses: ryanccn/attic-action@v0.4.1
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          inputs-from: "."
          token: ${{ github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC || secrets.ATTIC_TOKEN_CI }}

      - name: Build bin-macos-app
        run: nix build .#bin-macos-app

      - name: Smoke test
        run: |
          nix build .#smoke-test-bundle --out-link result-smoke -L
          cat result-smoke/smoke-test.log

      - name: Package app bundle as tarball
        run: |
          version="$(tr -d '\n' < VERSION)"
          app=$(find result/ -name '*.app' -maxdepth 1 -print -quit)
          tar -czf "logos-basecamp-${version}-aarch64-unsigned.app.tar.gz" -C result "$(basename "$app")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-app-aarch64-darwin
          path: logos-basecamp-*-aarch64-unsigned.app.tar.gz

  test-linux:
    needs: release_contract
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    env:
      ATTIC_AVAILABLE: >-
        ${{
          secrets.ATTIC_ENDPOINT != '' &&
          (
            (github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC != '') ||
            (github.ref != 'refs/heads/master' && secrets.ATTIC_TOKEN_CI != '')
          )
        }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:Z1wyVBEx8PHbXujYB52Mysv9Rd8rWIhyQ3bQyef9yy4=
            fallback = true

      - name: Setup Attic cache
        if: env.ATTIC_AVAILABLE == 'true'
        uses: ryanccn/attic-action@v0.4.1
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          inputs-from: "."
          token: ${{ github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC || secrets.ATTIC_TOKEN_CI }}

      - name: Integration test (UI tests)
        run: nix build .#integration-test -L

  test-macos:
    needs: release_contract
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    env:
      ATTIC_AVAILABLE: >-
        ${{
          secrets.ATTIC_ENDPOINT != '' &&
          (
            (github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC != '') ||
            (github.ref != 'refs/heads/master' && secrets.ATTIC_TOKEN_CI != '')
          )
        }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:Z1wyVBEx8PHbXujYB52Mysv9Rd8rWIhyQ3bQyef9yy4=
            fallback = true

      - name: Setup Attic cache
        if: env.ATTIC_AVAILABLE == 'true'
        uses: ryanccn/attic-action@v0.4.1
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          inputs-from: "."
          token: ${{ github.ref == 'refs/heads/master' && secrets.ATTIC_TOKEN_PUBLIC || secrets.ATTIC_TOKEN_CI }}

      - name: Integration test (UI tests)
        run: nix build .#integration-test-bundle -L

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [release_contract, build-appimage, build-macos-app, test-linux, test-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: appimage-x86_64-linux
          path: artifacts/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: appimage-aarch64-linux
          path: artifacts/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-app-aarch64-darwin
          path: artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ./*.AppImage ./*.app.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release_contract.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Logos Basecamp ${{ needs.release_contract.outputs.version }}
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.AppImage
            artifacts/*.app.tar.gz
            artifacts/SHA256SUMS

      - name: Verify and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release_contract.outputs.version }}
        run: |
          set -euo pipefail
          mkdir published-artifacts
          gh release download "$VERSION" --dir published-artifacts
          test "$(find published-artifacts -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(wc -l < published-artifacts/SHA256SUMS)" -eq 3
          (
            cd published-artifacts
            sha256sum --check SHA256SUMS
          )
          tag_target="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" \
              --jq '.object.sha'
          )"
          test "$tag_target" = "$GITHUB_SHA"
          gh release edit "$VERSION" --draft=false --prerelease --latest=false

      - name: Remove failed draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release_contract.outputs.version }}
        run: gh release delete "$VERSION" --yes --cleanup-tag || true
